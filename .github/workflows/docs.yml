name: Docs checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-build-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate source
        run: python scripts/validate_docs.py
      - name: Build site in strict mode
        run: zensical build --strict
      - name: Generate Word handbook
        run: python scripts/export_handbook.py
      - name: Generate PDF handbook
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-crosextra-carlito fonts-dejavu-core
          fc-match Carlito | grep -qi Carlito
          libreoffice --headless --convert-to pdf --outdir deliverables deliverables/greenhouse-sentinel-handbook.docx
      - name: Add downloads to the published site
        run: |
          mkdir -p site/downloads
          cp deliverables/greenhouse-sentinel-handbook.docx site/downloads/
          cp deliverables/greenhouse-sentinel-handbook.pdf site/downloads/
          cp deliverables/jays-greenhouse-training.pptx site/downloads/
      - name: Check generated artifacts
        run: |
          test -s deliverables/greenhouse-sentinel-handbook.docx
          test -s deliverables/greenhouse-sentinel-handbook.pdf
          test -s site/index.html
          test -s site/downloads/greenhouse-sentinel-handbook.docx
          test -s site/downloads/greenhouse-sentinel-handbook.pdf
          test -s site/downloads/jays-greenhouse-training.pptx
          grep -q 'assets/stylesheets/brand-2026.css' site/index.html
          python -c "from zipfile import ZipFile; archive = ZipFile('deliverables/greenhouse-sentinel-handbook.docx'); footer = b''.join(archive.read(name) for name in archive.namelist() if name.startswith('word/footer')); assert b'PAGE' in footer and b'NUMPAGES' in footer"
      - uses: actions/upload-artifact@v4
        with:
          name: greenhouse-sentinel-docs
          path: |
            site/
            deliverables/*.docx
            deliverables/*.pdf
            deliverables/*.pptx
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install site and test dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install
          npx playwright install --with-deps chromium
      - name: Run accessibility and responsive regression tests
        run: npm test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: [validate-build-export, browser-tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
